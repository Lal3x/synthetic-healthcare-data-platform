[project]
name = "synthetic-healthcare-data-platform"
version = "0.1.0"
description = "Reproducible healthcare analytics pipeline using synthetic Synthea data"
authors = [
    {name = "Lucas Alexandre",email = "174282100+Lal3x@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "streamlit (>=1.61.1,<2.0.0)",
    "plotly (>=6.9.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "healthcare_analytics", from = "src"}]

[project.scripts]
healthcare-analytics = "healthcare_analytics.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "apache-airflow-task-sdk (==1.1.7)",
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.taskipy.tasks]
lint = "ruff check --select I . && ruff format --check . && black --check ."
format = "ruff format . && ruff check --select I --fix . && black ."
tests = "pytest tests -v --cov=healthcare_analytics --cov-report=term-missing --cov-fail-under=70"

[tool.pytest.ini_options]
pythonpath = ["src", "src/healthcare_analytics"]
