x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE:-apache/airflow:3.1.7}
  image: ${AIRFLOW_IMAGE_NAME:-healthcare-analytics-airflow:3.1.7}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DATABASE_URL: postgresql+psycopg2://${APP_DB_USER:-healthcare_analytics}:${APP_DB_PASSWORD:-healthcare_analytics}@postgres-app:5432/${APP_DB_NAME:-healthcare_analytics}
    RAW_DATA_DIR: /opt/airflow/data/raw
    PYTHONPATH: /opt/airflow/healthcare_analytics/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./config/airflow:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/healthcare_analytics/src:ro
    - ./data:/opt/airflow/data:ro
    - ./sql:/opt/airflow/sql:ro
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres-airflow:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "${AIRFLOW_DB_PORT:-5433}:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-app:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-healthcare_analytics}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-healthcare_analytics}
      POSTGRES_DB: ${APP_DB_NAME:-healthcare_analytics}
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: healthcare-analytics-streamlit:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://${APP_DB_USER:-healthcare_analytics}:${APP_DB_PASSWORD:-healthcare_analytics}@postgres-app:5432/${APP_DB_NAME:-healthcare_analytics}
      SCHEMA_BRONZE: ${SCHEMA_BRONZE:-bronze}
      SCHEMA_SILVER: ${SCHEMA_SILVER:-silver}
      SCHEMA_GOLD: ${SCHEMA_GOLD:-gold}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./app:/opt/healthcare-analytics/app:ro
      - ./src:/opt/healthcare-analytics/src:ro
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{dags,logs,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{dags,logs,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  postgres-app-data:
