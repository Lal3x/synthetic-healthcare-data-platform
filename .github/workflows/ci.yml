name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar dependências
        run: poetry install --with dev

      - name: Executar hooks do pre-commit
        run: poetry run pre-commit run --all-files

      - name: Rodar lint
        run: poetry run task lint

      - name: Rodar testes
        run: poetry run task tests

  docker:
    name: Validar e construir Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar configuração local
        run: cp .env.example .env

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagens
        run: docker compose build airflow-api-server streamlit
